<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nifty Dashboard</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    font-size:16px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:left;
}

th{
    background:#eaeaea;
}

tr:hover{
    background:#f5f5f5;
}

</style>

</head>

<body>

<h1>📈 Stock Dashboard</h1>

<div class="card">
    <h2>📊 Market Health</h2>
    <h3>78%</h3>
    <p>Last Updated: 21-Jun-2026</p>
</div>

<div class="card">

    <h2>📋 Stock Master List</h2>

    <input
        type="text"
        id="searchBox"
        placeholder="Search Stock..."
        onkeyup="filterTable()">

    <table id="stockTable">

        <thead>
            <tr>
                <th>Symbol</th>
                <th>Sector</th>
            </tr>
        </thead>

        <tbody id="tableBody">

        </tbody>

    </table>

</div>

<script>

fetch("sector_mapping.csv")
.then(response => response.text())
.then(csv => {

    const rows = csv.split("\n").slice(1);

    let html = "";

    rows.forEach(row => {

        const cols = row.split(",");

        if(cols.length >= 2){

            html += `
            <tr>
                <td>${cols[0].trim()}</td>
                <td>${cols[1].trim()}</td>
            </tr>
            `;
        }

    });

    document.getElementById("tableBody").innerHTML = html;

});

function filterTable(){

    const input =
    document.getElementById("searchBox");

    const filter =
    input.value.toUpperCase();

    const table =
    document.getElementById("stockTable");

    const tr =
    table.getElementsByTagName("tr");

    for(let i=1;i<tr.length;i++){

        const td =
        tr[i].getElementsByTagName("td")[0];

        if(td){

            const txtValue =
            td.textContent ||
            td.innerText;

            tr[i].style.display =
            txtValue.toUpperCase()
            .indexOf(filter) > -1
            ? ""
            : "none";

        }
    }
}

</script>

</body>
</html>
