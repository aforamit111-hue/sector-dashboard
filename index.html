<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Nifty Stock Dashboard</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0px 2px 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:5px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th, td{
    border:1px solid #ddd;
    padding:8px;
    text-align:left;
}

th{
    background:#007bff;
    color:white;
}

tr:nth-child(even){
    background:#f9f9f9;
}

tr:hover{
    background:#f1f1f1;
}

.stat{
    font-size:20px;
    font-weight:bold;
    color:green;
}

</style>

</head>

<body>

<h1>📈 Nifty Stock Dashboard</h1>

<div class="card">

<h2>📊 Dashboard Summary</h2>

<p>
Total Stocks:
<span class="stat" id="stockCount">0</span>
</p>

</div>

<div class="card">

<h2>📋 Stock Master List</h2>

<input
type="text"
id="searchBox"
placeholder="Search Stock..."
onkeyup="filterTable()">

<table id="stockTable">

<thead>
<tr>
<th>Stock</th>
<th>Sector</th>
<th>Score</th>
</tr>
</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

<script>

let allStocks = [];

fetch("stocks.json")
.then(response => response.json())
.then(data => {

    allStocks = data;

    document.getElementById("stockCount").innerText =
    data.length;

    renderTable(data);

})
.catch(error => {

    console.error(error);

    document.getElementById("tableBody").innerHTML =
    "<tr><td colspan='3'>Unable to load stocks.json</td></tr>";

});

function renderTable(data){

    let html = "";

    data.forEach(stock => {

        html += `
        <tr>
            <td>${stock.symbol}</td>
            <td>${stock.sector}</td>
            <td>${stock.score}</td>
        </tr>
        `;

    });

    document.getElementById("tableBody").innerHTML =
    html;
}

function filterTable(){

    const search =
    document.getElementById("searchBox")
    .value
    .toUpperCase();

    const filtered =
    allStocks.filter(stock =>
        stock.symbol.toUpperCase().includes(search)
    );

    renderTable(filtered);
}

</script>

</body>

</html>
