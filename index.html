<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nifty Dashboard V4</title>
<style>
:root{
--bg:#f4f6f9;--card:#fff;--text:#222;--primary:#007bff;
}
.dark{
--bg:#121212;--card:#1e1e1e;--text:#f5f5f5;--primary:#4da3ff;
}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);padding:20px;margin:0}
.card{background:var(--card);padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.summary{display:flex;gap:10px;flex-wrap:wrap}
.summary .card{flex:1;min-width:180px}
button,select,input{padding:10px;border-radius:6px;border:1px solid #ccc}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:8px}
th{background:var(--primary);color:white;position:sticky;top:0}
.sector-card{display:inline-block;margin:5px;padding:10px;background:var(--card);border-left:4px solid var(--primary);cursor:pointer}
</style>
</head>
<body>
<h1>📈 Nifty Dashboard V4</h1>

<button onclick="toggleDarkMode()">🌙 Dark Mode</button>
<button onclick="exportCSV()">📁 Export CSV</button>

<div class="summary">
<div class="card"><h3>Total Stocks</h3><h2 id="stockCount">0</h2></div>
<div class="card"><h3>Total Sectors</h3><h2 id="sectorCount">0</h2></div>
<div class="card"><h3>Visible Stocks</h3><h2 id="visibleCount">0</h2></div>
</div>

<div class="card">
<h2>📊 Sector Cards</h2>
<div id="sectorCards"></div>
</div>

<div class="card">
<select id="sectorFilter" onchange="applyFilters()"><option value="All">All Sectors</option></select>
<input id="searchBox" placeholder="Search Stock" onkeyup="applyFilters()">
</div>

<div class="card">
<table>
<thead>
<tr><th>⭐</th><th>Stock</th><th>Sector</th><th>Score</th></tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<script>
let allStocks=[];

fetch('stocks.json')
.then(r=>r.json())
.then(data=>{
allStocks=data;
document.getElementById('stockCount').innerText=data.length;
document.getElementById('visibleCount').innerText=data.length;

const sectors=[...new Set(data.map(x=>x.sector))];
document.getElementById('sectorCount').innerText=sectors.length;

const dd=document.getElementById('sectorFilter');
sectors.sort().forEach(s=>dd.innerHTML+=`<option>${s}</option>`);

let cards='';
sectors.forEach(s=>cards+=`<div class="sector-card" onclick="pickSector('${s}')">${s}</div>`);
document.getElementById('sectorCards').innerHTML=cards;

renderTable(data);
});

function renderTable(data){
document.getElementById('visibleCount').innerText=data.length;
let html='';
data.forEach(stock=>{
html+=`<tr>
<td>${stock.watchlist?'⭐':'☆'}</td>
<td>${stock.symbol}</td>
<td>${stock.sector}</td>
<td>${stock.score}</td>
</tr>`;
});
document.getElementById('tableBody').innerHTML=html;
}

function applyFilters(){
const s=document.getElementById('searchBox').value.toUpperCase();
const sec=document.getElementById('sectorFilter').value;

const filtered=allStocks.filter(x=>
(sec==='All'||x.sector===sec) &&
x.symbol.toUpperCase().includes(s)
);
renderTable(filtered);
}

function pickSector(sec){
document.getElementById('sectorFilter').value=sec;
applyFilters();
}

function toggleDarkMode(){
document.body.classList.toggle('dark');
}

function exportCSV(){
let rows=[["Symbol","Sector","Score"]];
allStocks.forEach(x=>rows.push([x.symbol,x.sector,x.score]));
let csv=rows.map(r=>r.join(",")).join("\n");
let blob=new Blob([csv],{type:'text/csv'});
let a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='stocks.csv';
a.click();
}
</script>
</body>
</html>
