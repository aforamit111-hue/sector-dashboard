<!DOCTYPE html>
<html>
<head>
    <title>Sector Dashboard</title>
    .card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

body{
    background:#f4f4f4;
    font-family:Arial;
    padding:20px;
}
    </style>
</head>
<body>

<h1>📈 Top 5 Strongest Sectors</h1>

<div id="dashboard"></div>

<script>

fetch("sector_data.json")
.then(response => response.json())
.then(data => {

let html = `
html = `
<div class="card">
<h2>📊 Market Health</h2>
<h1>${data.market_health}%</h1>
<p>Last Updated: ${data.last_updated}</p>
</div>
`;

data.sectors.forEach(item => {

html += `
<div class="card">
<h2>${item.sector}</h2>
<p>Sector Score: ${item.score}</p>

<ul>
${item.stocks.map(stock =>
`<li>
<a href="https://www.google.com/search?q=${stock}+share+price"
target="_blank">
${stock}
</a>
</li>`).join("")}
</ul>

</div>
`;

});
html += `
<div class="card">
<h2>🏆 Top Stocks Overall</h2>

<ul>
${data.top_stocks.map(stock =>
`<li>${stock}</li>`).join("")}
</ul>

</div>
`;
document.getElementById("dashboard").innerHTML = html;

});

</script>

});

</script>

</body>
</html>
